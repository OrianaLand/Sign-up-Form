<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" type="text/css" />
    <title>Sing-Up Form</title>
  </head>
  <body>
    <div class="bg-container">
      <div class="odin-logo">
        <img src="odin-logo.png" alt="Odin Icon" />
        <h1>Odin</h1>

        <footer class="bg-footer">
          Photo by
          <a
            href="https://unsplash.com/@leonmcgregor?utm_source=unsplash&utm_medium=referral"
            target="_blank"
            >Léon McGregor</a
          >
          on <a href="https://unsplash.com" target="_blank">Unsplash</a>.
        </footer>
      </div>
    </div>

    <div class="content">
      <div class="header-container">
        <h1>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. <br />Sing
          up <em>now</em> to get started. <br />
          <br />You <em>know</em> you want to.
        </h1>
      </div>
      <form action="#" method="get">
        <div class="input-container">
          <h1>Let's do this!</h1>
          <div class="input-pair">
            <p class="input-group">
              <label for="first-name">First Name:</label>
              <input type="text" id="first-name" name="first-name" />
            </p>
            <p class="input-group">
              <label for="last-name">Last Name:</label>
              <input type="text" id="last-name" name="last-name" />
            </p>
          </div>
          <div class="input-pair">
            <p class="input-group">
              <label for="mail">Email:</label>
              <input type="email" id="mail" name="mail" />
            </p>
            <p class="input-group">
              <label for="telephone">Phone Number:</label>
              <input type="text" id="telephone" name="telephone" />
            </p>
          </div>
          <div class="input-pair">
            <p class="input-group">
              <label for="password">Passsword:</label>
              <input type="text" id="password" name="password" />
            </p>
            <p class="input-group">
              <label for="password">Confirm Passsword:</label>
              <input type="text" id="password" name="password" />
            </p>
          </div>
        </div>
        <div class="footer-container">
          <button type="submit" class="button">Create Account</button>
          <footer class="form-footer">
            Already have an account?<a href="#">Log in</a>
          </footer>
        </div>
      </form>
    </div>
  </body>
</html>
